name: Temporary project UI and quiz fix
on:
  push:
    paths:
      - '.github/workflows/tmp-project-ui-quiz-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/import-quiz-cms-old-su26
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply scoped fixes
        run: python .github/scripts/tmp_project_ui_quiz_fix.py
      - name: Backend syntax
        run: python -m py_compile backend/app/services/ap_academic_sync.py backend/app/schemas/question_bank.py
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Frontend lint
        working-directory: frontend
        run: npm run lint -- --max-warnings=0
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/services/ap_academic_sync.py backend/app/schemas/question_bank.py frontend/app/bank/quiz/page.tsx frontend/app/student-management/classes/'[classId]'/page.tsx frontend/app/ap-sync/page.tsx frontend/app/layout.tsx frontend/styles/project-spacing-contract.css
          git diff --cached --check
          git commit -m 'fix: simplify quiz config and normalize project spacing'
          git push origin HEAD:feat/import-quiz-cms-old-su26
