name: Temporary project UI and quiz fix
on:
  push:
    paths:
      - '.github/workflows/tmp-project-ui-quiz-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/import-quiz-cms-old-su26
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply scoped fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')
          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')
          def must_replace(text, old, new, label, count=None):
              actual = text.count(old)
              if actual == 0:
                  raise SystemExit(f'Missing patch anchor: {label}')
              if count is not None and actual != count:
                  raise SystemExit(f'Unexpected anchor count {label}: {actual} != {count}')
              return text.replace(old, new)

          # 1) AP gateway: product is POLY or PTCD; subject catalog is scoped by term.
          p = 'backend/app/services/ap_academic_sync.py'
          s = read(p)
          old = """        # get-all-subject is intentionally global/keyless. Do not send the legacy
        # branch/term query parameters; scope is applied locally when fields exist.
        with httpx.Client(timeout=self.timeout_seconds, verify=self._verify_config(endpoint)) as http:
            response = http.get(endpoint, headers=self._headers())
"""
          new = """        product = 'POLY' if normalized_branch == 'poly' else 'PTCD'
        params = {'product': product}
        if normalized_term:
            params['term_name'] = normalized_term
        with httpx.Client(timeout=self.timeout_seconds, verify=self._verify_config(endpoint)) as http:
            response = http.get(endpoint, headers=self._headers(), params=params)
"""
          s = must_replace(s, old, new, 'get-all-subject product/term', 1)
          write(p, s)

          # 2) Quiz request schemas: question-type quota is no longer part of create/preview/auto-map contract.
          p = 'backend/app/schemas/question_bank.py'
          s = read(p)
          s = must_replace(s, 'class BankReleaseQuizPreviewRequest(QuestionTypeQuotaMixin):', 'class BankReleaseQuizPreviewRequest(BaseModel):', 'release preview schema', 1)
          s = must_replace(s, "        self.validate_type_quota(self.total_questions)\n        return self\n", "        return self\n", 'release type validator', 1)
          s = must_replace(s, 'class QuizAutoMapRequest(QuestionTypeQuotaMixin):', 'class QuizAutoMapRequest(BaseModel):', 'automap schema', 1)
          # second validator occurrence after schema change
          marker = "class QuizAutoMapRequest(BaseModel):"
          pos = s.index(marker)
          tail = s[pos:]
          oldv = "        self.validate_type_quota(self.total_questions)\n        return self\n"
          if oldv in tail:
              tail = tail.replace(oldv, "        return self\n", 1)
              s = s[:pos] + tail
          else:
              raise SystemExit('Missing automap type validator')
          write(p, s)

          # 3) Quiz UI: remove question-type quota controls and stop sending those fields.
          p = 'frontend/app/bank/quiz/page.tsx'
          s = read(p)
          for line in [
              '  singleSelectCount: number\n', '  multiSelectCount: number\n',
              '  textInputCount: number\n', '  numericalInputCount: number\n',
              '    singleSelectCount: 15,\n', '    multiSelectCount: 0,\n',
              '    textInputCount: 0,\n', '    numericalInputCount: 0,\n',
              '    singleSelectCount: 30,\n',
          ]:
              s = s.replace(line, '')
          s = re.sub(r"\n  const quizTypeTotal = quizConfig\.singleSelectCount \+ quizConfig\.multiSelectCount \+ quizConfig\.textInputCount \+ quizConfig\.numericalInputCount\n  const finalTypeTotal = finalConfig\.singleSelectCount \+ finalConfig\.multiSelectCount \+ finalConfig\.textInputCount \+ finalConfig\.numericalInputCount", '', s)
          s = re.sub(r"\n\s*single_select_count: (?:quizConfig|config)\.singleSelectCount,\n\s*multi_select_count: (?:quizConfig|config)\.multiSelectCount,\n\s*text_input_count: (?:quizConfig|config)\.textInputCount,\n\s*numerical_input_count: (?:quizConfig|config)\.numericalInputCount,", '', s)
          s = re.sub(r"\n\s*single_select_count: finalConfig\.singleSelectCount,\n\s*multi_select_count: finalConfig\.multiSelectCount,\n\s*text_input_count: finalConfig\.textInputCount,\n\s*numerical_input_count: finalConfig\.numericalInputCount,", '', s)
          s = s.replace("    const quizInvalid = quizDifficultyTotal !== 100 || quizTypeTotal !== quizConfig.totalQuestions\n    const finalInvalid = finalDifficultyTotal !== 100 || finalTypeTotal !== finalConfig.totalQuestions\n", "    const quizInvalid = quizDifficultyTotal !== 100\n    const finalInvalid = finalDifficultyTotal !== 100\n")
          s = re.sub(r"\n      if \(patch\.totalQuestions !== undefined\) \{\n        const otherTypes = next\.multiSelectCount \+ next\.textInputCount \+ next\.numericalInputCount\n        if \(otherTypes <= next\.totalQuestions\) next\.singleSelectCount = next\.totalQuestions - otherTypes\n        else \{\n          next\.singleSelectCount = next\.totalQuestions\n          next\.multiSelectCount = 0\n          next\.textInputCount = 0\n          next\.numericalInputCount = 0\n        \}\n      \}", '', s)
          s = re.sub(r"\n    const typeTotal = config\.singleSelectCount \+ config\.multiSelectCount \+ config\.textInputCount \+ config\.numericalInputCount", '', s)
          s = re.sub(r"\n      <div className=\"section-heading compact-heading quiz-timer-subhead\">\n        <div><h3>Loại câu hỏi</h3>.*?\n      \{typeTotal !== config\.totalQuestions \? <div className=\"alert warning\">.*?</div> : null\}", '', s, flags=re.S)
          s = re.sub(r"\n      singleSelectCount: Number\(blueprint\.single_select_count \?\? blueprint\.total_questions\),\n      multiSelectCount: Number\(blueprint\.multi_select_count \?\? 0\),\n      textInputCount: Number\(blueprint\.text_input_count \?\? 0\),\n      numericalInputCount: Number\(blueprint\.numerical_input_count \?\? 0\),", '', s)
          s = re.sub(r"\n    const typeTotal = config\.singleSelectCount \+ config\.multiSelectCount \+ config\.textInputCount \+ config\.numericalInputCount\n    if \(difficultyTotal !== 100 \|\| typeTotal !== config\.totalQuestions\) \{", "\n    if (difficultyTotal !== 100) {", s)
          s = re.sub(r"\n\s*single_select_count: config\.singleSelectCount,\n\s*multi_select_count: config\.multiSelectCount,\n\s*text_input_count: config\.textInputCount,\n\s*numerical_input_count: config\.numericalInputCount,", '', s)
          # Guard: no user-facing type quota remains on this page.
          if 'Loại câu hỏi' in s or 'singleSelectCount' in s or 'quizTypeTotal' in s:
              raise SystemExit('Quiz type quota references remain in page.tsx')
          write(p, s)

          # 4) Remove the duplicate top Udemy operation banner from class detail. Keep the progress-panel import action.
          p = 'frontend/app/student-management/classes/[classId]/page.tsx'
          s = read(p)
          # Remove only the banner containing the exact title; nearest standalone notice/card block.
          pattern = re.compile(r"\n\s*<div className=\"[^\"]*\"[^>]*>\s*(?:.|\n)*?Lớp đang vận hành trên Udemy(?:.|\n)*?Import / kế hoạch Udemy(?:.|\n)*?</div>\s*(?=\n)", re.M)
          match = pattern.search(s)
          if not match:
              # Safer fallback: remove a JSX block bracketed by the known banner copy and direct subject-management link.
              pattern = re.compile(r"\n\s*\{[^\n]*learningPlatform[^\n]*\?\s*<div.*?Lớp đang vận hành trên Udemy.*?subject-management.*?</div>\s*:\s*null\}\s*", re.S)
              match = pattern.search(s)
          if not match:
              raise SystemExit('Could not locate Udemy operation banner')
          s = s[:match.start()] + '\n' + s[match.end():]
          if 'Lớp đang vận hành trên Udemy' in s:
              raise SystemExit('Udemy top banner text still remains')
          write(p, s)

          # 5) AP sync action: expose an explicit campus refresh affordance.
          p = 'frontend/app/ap-sync/page.tsx'
          s = read(p)
          s = s.replace("{loadingOptions ? 'Đang tải...' : 'Làm mới dữ liệu'}", "{loadingOptions ? 'Đang cập nhật...' : 'Cập nhật cơ sở'}", 1)
          write(p, s)

          # 6) Project-wide spacing/layout contract loaded LAST, instead of page-by-page CSS band-aids.
          p = 'frontend/app/layout.tsx'
          s = read(p)
          anchor = "import '../styles/subject-management-udemy.css'\n"
          if "project-spacing-contract.css" not in s:
              s = must_replace(s, anchor, anchor + "import '../styles/project-spacing-contract.css'\n", 'root final spacing import', 1)
          write(p, s)

          css = r'''/* Project-wide spacing and layout integrity contract.
             Loaded last so shared page primitives remain visually separated across ACMS. */
          :root {
            --acms-space-1: 4px;
            --acms-space-2: 8px;
            --acms-space-3: 12px;
            --acms-space-4: 16px;
            --acms-space-5: 20px;
            --acms-space-6: 24px;
          }

          *, *::before, *::after { box-sizing: border-box; }
          main, section, article, form, fieldset, .app-main, .app-content, .page-root,
          .workspace-section, .bank-contract-page, .enterprise-standard-page { min-width: 0; }

          .page-stack,
          .bank-multipage,
          .enterprise-standard-page,
          .quiz-creation-workbench,
          .ap-sync-page { gap: var(--acms-space-5); }

          .workspace-section,
          .popup-action-panel,
          .bank-section,
          .enterprise-panel,
          .settings-card,
          .card { min-width: 0; }

          .workspace-section > * + *,
          .popup-action-panel > * + *,
          .settings-card > * + * { margin-top: var(--acms-space-4); }

          .section-heading,
          .enterprise-section-heading,
          .workspace-section-header {
            gap: var(--acms-space-3);
            align-items: flex-start;
          }

          .section-heading h2, .section-heading h3,
          .workspace-section h2, .workspace-section h3,
          .popup-action-panel h2, .popup-action-panel h3 { margin-block: 0; }

          label:not(.toggle-line):not(.check-row) > .input,
          label:not(.toggle-line):not(.check-row) > select,
          label:not(.toggle-line):not(.check-row) > textarea { margin-top: 6px; }

          .settings-form-grid,
          .quiz-small-grid,
          .quiz-type-quota-grid,
          .option-grid,
          .compact-filter-grid,
          .filter-grid,
          .form-grid { gap: var(--acms-space-3) var(--acms-space-4); }

          .toolbar,
          .toolbar-actions,
          .section-actions,
          .header-actions,
          .dialog-actions,
          .modal-actions,
          .button-row,
          .filter-actions {
            gap: var(--acms-space-2);
            flex-wrap: wrap;
          }

          .toggle-line, .check-row { gap: var(--acms-space-2); }

          .alert, .academic-inline-notice, .inline-notice { margin-block: var(--acms-space-3); }

          .table-scroll, .enterprise-table-scroll, .data-table-scroll {
            max-width: 100%;
            overflow-x: auto;
            overscroll-behavior-inline: contain;
          }

          [role='dialog'] .dialog-body,
          [role='dialog'] .modal-body {
            min-width: 0;
            padding-block: var(--acms-space-4);
          }

          [role='dialog'] .dialog-footer,
          [role='dialog'] .modal-footer {
            gap: var(--acms-space-2);
            padding-top: var(--acms-space-3);
          }

          .quiz-modal-grid { gap: var(--acms-space-4); align-items: start; }
          .quiz-timer-subhead { margin-top: var(--acms-space-4); }

          @media (max-width: 960px) {
            .quiz-modal-grid,
            .settings-form-grid,
            .form-grid { grid-template-columns: minmax(0, 1fr); }
            .page-stack, .bank-multipage, .enterprise-standard-page { gap: var(--acms-space-4); }
          }

          @media (max-width: 640px) {
            .toolbar, .toolbar-actions, .section-actions, .header-actions,
            .dialog-actions, .modal-actions, .button-row, .filter-actions { width: 100%; }
            .toolbar-actions > .btn, .dialog-actions > .btn, .modal-actions > .btn { max-width: 100%; }
          }
          '''
          write('frontend/styles/project-spacing-contract.css', css)
          PY
      - name: Syntax and frontend checks
        shell: bash
        run: |
          python -m py_compile backend/app/services/ap_academic_sync.py backend/app/schemas/question_bank.py
          grep -R "Loại câu hỏi" frontend/app/bank/quiz/page.tsx && exit 1 || true
          grep -R "singleSelectCount\|multiSelectCount\|textInputCount\|numericalInputCount" frontend/app/bank/quiz/page.tsx && exit 1 || true
          cd frontend
          npm ci
          npm run typecheck
          npm run lint -- --max-warnings=0
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/services/ap_academic_sync.py backend/app/schemas/question_bank.py frontend/app/bank/quiz/page.tsx frontend/app/student-management/classes/'[classId]'/page.tsx frontend/app/ap-sync/page.tsx frontend/app/layout.tsx frontend/styles/project-spacing-contract.css
          git diff --cached --check
          git commit -m 'fix: simplify quiz config and normalize project spacing'
          git push origin HEAD:feat/import-quiz-cms-old-su26
