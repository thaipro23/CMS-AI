name: Audit frontend email rendering

on:
  push:
    branches: [feat/import-quiz-cms-old-su26]
    paths:
      - '.github/workflows/audit-email-rendering.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Find possible raw email exposure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          print('=== FRONTEND EMAIL REFERENCES ===')
          for path in sorted(Path('frontend').rglob('*')):
              if path.suffix not in {'.ts', '.tsx'}:
                  continue
              hits = []
              for no, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if 'email' in line.lower() and path.suffix == '.tsx':
                      hits.append((no, line.strip()))
              if hits:
                  print(f'\n### {path}')
                  for no, line in hits:
                      print(f'{no}: {line}')

          print('\n=== BACKEND EMAIL SERIALIZATION / EXPORT REFERENCES ===')
          for path in sorted(Path('backend').rglob('*.py')):
              hits = []
              for no, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  lower = line.lower()
                  if 'email' not in lower:
                      continue
                  if any(token in lower for token in (
                      '.email', "['email']", '.get(\'email\')', '.get("email")',
                      'teacher_email', 'masked_email', 'private_email', "'email'", '"email"',
                  )):
                      hits.append((no, line.strip()))
              if hits:
                  print(f'\n### {path}')
                  for no, line in hits:
                      print(f'{no}: {line}')
          PY
