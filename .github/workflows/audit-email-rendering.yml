name: Audit frontend email rendering

on:
  push:
    branches: [feat/import-quiz-cms-old-su26]
    paths:
      - '.github/workflows/audit-email-rendering.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Find possible raw email rendering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          patterns = [
              re.compile(r'\{[^}\n]*(?:\.email|_email|\bemail\b)[^}\n]*\}', re.I),
              re.compile(r'\$\{[^}\n]*(?:\.email|_email|\bemail\b)[^}\n]*\}', re.I),
          ]
          for path in sorted(Path('frontend').rglob('*')):
              if path.suffix not in {'.ts', '.tsx'}:
                  continue
              text = path.read_text(encoding='utf-8')
              hits = []
              for no, line in enumerate(text.splitlines(), 1):
                  if 'email' not in line.lower():
                      continue
                  if any(pattern.search(line) for pattern in patterns) or path.suffix == '.tsx':
                      hits.append((no, line.strip()))
              if hits:
                  print(f'\n### {path}')
                  for no, line in hits:
                      print(f'{no}: {line}')
          PY
