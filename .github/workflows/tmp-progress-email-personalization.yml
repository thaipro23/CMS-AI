name: Temporary progress email personalization TDD

on:
  push:
    branches: [feat/import-quiz-cms-old-su26]
    paths:
      - '.github/workflows/tmp-progress-email-personalization.yml'
      - 'scripts/apply_progress_email_personalization.py'
      - 'backend/app/tests/test_academic_progress_email.py'
      - 'backend/app/services/academic/progress_email.py'
      - 'backend/app/worker.py'

permissions:
  contents: write

jobs:
  targeted:
    runs-on: ubuntu-24.04
    env:
      APP_ENV: test
      DEBUG: 'false'
      MOCK_LLM: 'true'
      USE_MOCK_OPENEDX: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/import-quiz-cms-old-su26
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements-runtime.txt
            backend/requirements-ci.txt
      - name: Install backend CI dependencies
        working-directory: backend
        run: python -m pip install -r requirements-ci.txt
      - name: Apply implementation
        run: python scripts/apply_progress_email_personalization.py
      - name: Compile changed backend files
        run: python -m py_compile backend/app/services/academic/progress_email.py backend/app/worker.py
      - name: Run targeted regression tests
        working-directory: backend
        run: pytest -q app/tests/test_academic_progress_email.py app/tests/test_email_privacy_contract.py
      - name: Verify no recipient addresses are persisted by worker
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('backend/app/worker.py').read_text(encoding='utf-8')
          start = text.index("@celery_app.task(name='academic_progress_email_task'")
          end = text.index('\ndef _enqueue_academic_class_sync_child_job', start)
          body = text[start:end]
          assert "emails=[recipient_email]" in body
          assert "'mail_send_deliveries'" in body
          assert "'private_email':" not in body
          assert "'recipient_addresses_logged': False" in body
          PY
      - name: Commit verified implementation
        run: |
          rm -f .github/workflows/tmp-progress-email-personalization.yml scripts/apply_progress_email_personalization.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: personalize progress reminders in AI Server'
          git push origin HEAD:feat/import-quiz-cms-old-su26
