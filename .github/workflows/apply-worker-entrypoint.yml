name: Align Celery runtime entrypoint

on:
  push:
    branches: [fix/daily-teacher-report-pipeline]
    paths:
      - '.github/workflows/apply-worker-entrypoint.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/daily-teacher-report-pipeline
          fetch-depth: 0
      - name: Use production registration entrypoint everywhere Celery starts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          touched = []
          for name in ('docker-compose.yml', 'docker-compose.prod.yml'):
              path = Path(name)
              source = path.read_text(encoding='utf-8')
              before = source.count('app.worker.celery_app')
              if before <= 0:
                  raise SystemExit(f'{name}: legacy Celery entrypoint not found')
              source = source.replace('app.worker.celery_app', 'app.worker_entry.celery_app')
              if 'app.worker.celery_app' in source:
                  raise SystemExit(f'{name}: legacy entrypoint remains')
              if source.count('app.worker_entry.celery_app') < before:
                  raise SystemExit(f'{name}: replacement count mismatch')
              path.write_text(source, encoding='utf-8')
              touched.append((name, before))

          workflow = Path('.github/workflows/apply-worker-entrypoint.yml')
          workflow.unlink()
          print(touched)
          PY
      - name: Validate production Compose and static dev contract
        shell: bash
        run: |
          cp .env.production.example .env.production
          POSTGRES_PASSWORD=ci_password APP_VERSION=25.9.16.7.2.64.16.5.7.2.18 \
            docker compose -f docker-compose.prod.yml --env-file .env.production config >/tmp/compose.prod.yml
          ! grep -R 'app.worker.celery_app' docker-compose.yml docker-compose.prod.yml
          grep -q 'app.worker_entry.celery_app' docker-compose.prod.yml
          grep -q 'app.worker_entry.celery_app' docker-compose.yml
      - name: Commit runtime alignment
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docker-compose.yml docker-compose.prod.yml .github/workflows/apply-worker-entrypoint.yml
          git commit -m 'fix: load daily report celery registration in runtime'
          git push origin HEAD:fix/daily-teacher-report-pipeline
