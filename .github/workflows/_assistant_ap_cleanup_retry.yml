name: Assistant AP cleanup retry
on:
  push:
    branches:
      - feat/import-quiz-cms-old-su26
    paths:
      - .github/workflows/_assistant_ap_cleanup_retry.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/import-quiz-cms-old-su26
          fetch-depth: 0
      - name: Apply cleanup
        run: python _assistant_ap_cleanup.py
      - name: Audit runtime contract
        run: |
          python - <<'PY'
          from pathlib import Path
          client = Path('backend/app/services/ap_academic_sync.py').read_text()
          config = Path('backend/app/core/config.py').read_text()
          prod = Path('.env.production.example').read_text()
          compose = Path('docker-compose.prod.yml').read_text()
          assert 'api_v2.poly.edu.vn' not in client
          assert 'API key/kết nối AP' not in client
          assert 'ACADEMIC_AP_API_KEY is required' not in config
          assert 'api_v2.poly.edu.vn' not in config
          assert 'api_v2.poly.edu.vn' not in prod
          assert 'api_v2.poly.edu.vn' not in compose
          assert 'https://api.poly.edu.vn/api/cms' in config
          assert 'def get_campuses' in client
          assert "params={'product': product}" in client
          assert "response = http.get(endpoint, headers=self._headers())" in client
          assert "response = http.post(endpoint, headers=self._headers(), json=body)" in client
          assert "headers['Authorization']" not in client
          assert 'from urllib.parse import urlparse' not in client
          PY
          test -z "$(git diff -- frontend/app/globals.css frontend/styles/enterprise-ui.css)"
          git diff --check
      - name: Install backend CI dependencies
        working-directory: backend
        run: python -m pip install --disable-pip-version-check -q -r requirements-ci.txt
      - name: Compile and Ruff fatal checks
        working-directory: backend
        run: |
          python -m compileall -q app
          ruff check app --select E9,F63,F7,F82
      - name: Regression tests
        working-directory: backend
        run: |
          pytest -q app/tests/test_academic_ap_internal_api.py
          pytest -q app/tests/test_academic_connector_contract_compat.py
      - name: Commit verified cleanup
        run: |
          rm -f _assistant_ap_cleanup.py
          rm -f .github/workflows/_assistant_ap_internal_cleanup.yml
          rm -f .github/workflows/_assistant_ap_cleanup_retry.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove stale AP gateway assumptions'
          git push origin HEAD:feat/import-quiz-cms-old-su26
