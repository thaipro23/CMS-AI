name: Apply learning enrollment preservation patch

# One-shot workflow; it deletes itself after the bounded patch passes focused tests.
on:
  push:
    branches: [fix/daily-teacher-report-pipeline]
    paths:
      - '.github/workflows/apply-learning-enrollment-guard.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/daily-teacher-report-pipeline
          fetch-depth: 0
      - name: Apply bounded source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('backend/app/services/academic/sync_enrollment.py')
          source = source_path.read_text(encoding='utf-8')

          helper_anchor = """    def __getattr__(self, name: str) -> Any:\n        return getattr(self.parent, name)\n\ndef _normalize_class_sync_limit"""
          helper_replacement = """    def __getattr__(self, name: str) -> Any:\n        return getattr(self.parent, name)\n\ndef _preserve_confirmed_enrollment_for_learning(\n        snapshot: AcademicStudentLearningSnapshot | Any | None,\n        result: dict[str, Any],\n    ) -> dict[str, Any]:\n        \"\"\"Keep write-confirmed enrollment when learning analytics is incomplete.\n\n        Learning analytics is a read-side enrichment. A replica miss or omitted\n        learner must never downgrade an enrollment previously confirmed by the\n        enrollment workflow. Explicit negative enrollment evidence is not hidden.\n        The raw learning-side status is retained for diagnostics.\n        \"\"\"\n        normalized = dict(result or {})\n        enrollment = normalized.get('enrollment') if isinstance(normalized.get('enrollment'), dict) else {}\n        raw_status = normalized.get('enrollment_status') or enrollment.get('status')\n        incoming_status = str(raw_status or '').strip().lower()\n        is_enrolled = normalized.get('is_enrolled')\n        if is_enrolled is None:\n            is_enrolled = enrollment.get('is_enrolled')\n\n        positive = (\n            incoming_status in {'enrolled', 'already_enrolled', 'created', 'reactivated'}\n            or is_enrolled is True\n        )\n        explicit_negative = (\n            incoming_status in {'not_enrolled', 'unenrolled', 'inactive'}\n            or is_enrolled is False\n        )\n        previous_status = str(getattr(snapshot, 'enrollment_status', '') or '').strip().lower()\n        previous_synced_at = getattr(snapshot, 'enrollment_synced_at', None)\n\n        if (\n            snapshot is not None\n            and previous_status == 'enrolled'\n            and previous_synced_at is not None\n            and not positive\n            and not explicit_negative\n        ):\n            normalized['learning_analytics_enrollment_status'] = incoming_status or None\n            normalized['enrollment_status'] = 'enrolled'\n            previous_mode = str(getattr(snapshot, 'enrollment_mode', '') or '').strip()\n            if not str(normalized.get('enrollment_mode') or '').strip() and previous_mode:\n                normalized['enrollment_mode'] = previous_mode\n            normalized['enrollment_preserved_from_snapshot'] = True\n\n        return normalized\n\ndef _normalize_class_sync_limit"""
          if source.count(helper_anchor) != 1:
              raise SystemExit('helper anchor mismatch')
          source = source.replace(helper_anchor, helper_replacement, 1)

          loop_anchor = """                if enrollment_status_raw in {'enrolled', 'already_enrolled', 'created', 'reactivated'} or _boolish(result.get('is_enrolled')) or enrollment_payload.get('is_enrolled') is True:\n                    connector_enrolled_seen += 1\n                progress_payload = result.get('progress') if isinstance(result.get('progress'), dict) else {}\n"""
          loop_replacement = """                if enrollment_status_raw in {'enrolled', 'already_enrolled', 'created', 'reactivated'} or _boolish(result.get('is_enrolled')) or enrollment_payload.get('is_enrolled') is True:\n                    connector_enrolled_seen += 1\n\n                # Enrollment and learning share one snapshot row. Preserve a\n                # write-confirmed enrollment when this read-side response is\n                # incomplete (most commonly replica lag or an omitted learner).\n                # Do this only after connector_enrolled_seen is counted so the\n                # health guard still reflects what the connector actually saw.\n                result = _preserve_confirmed_enrollment_for_learning(_snapshot, result)\n                progress_payload = result.get('progress') if isinstance(result.get('progress'), dict) else {}\n"""
          if source.count(loop_anchor) != 1:
              raise SystemExit('learning loop anchor mismatch')
          source = source.replace(loop_anchor, loop_replacement, 1)
          source_path.write_text(source, encoding='utf-8')

          context_path = Path('MASTER_CONTEXT_DASH_CMS.md')
          if context_path.exists():
              context = context_path.read_text(encoding='utf-8')
              marker = '## Update 2026-09-14 — Enrollment snapshot preservation during CMS learning sync'
              if marker not in context:
                  context += f'''\n\n{marker}\n\n- Production evidence: COM109 showed 7174/7174 CMS matches but only 7143/7174 enrolled in the learning KPI.\n- Root cause: enrollment sync and learning analytics share `AcademicStudentLearningSnapshot`; a later learning read could overwrite a write-confirmed `enrolled` value with `unknown` when the connector/replica omitted a learner.\n- Fix: learning analytics may enrich progress/grades but cannot downgrade a previously confirmed enrollment to `unknown`/missing. Explicit negative evidence such as `not_enrolled` is still preserved.\n- Connector health accounting is computed before the preservation guard, so replica/plugin failures remain visible and are not falsely counted as connector-confirmed enrollment.\n- `0 đã học` with full enrollment remains valid when Open edX has no progress/grade/activity for those learners.\n- Regression: `backend/app/tests/test_learning_sync_preserves_confirmed_enrollment.py`.\n- All public report timestamps remain `Asia/Ho_Chi_Minh` (+07:00).\n'''
                  context_path.write_text(context, encoding='utf-8')

          workflow = Path('.github/workflows/apply-learning-enrollment-guard.yml')
          workflow.unlink()
          PY
      - name: Verify focused regression before commit
        working-directory: backend
        run: |
          python -m pip install -q -r requirements-ci.txt
          pytest -q app/tests/test_learning_sync_preserves_confirmed_enrollment.py app/tests/test_daily_teacher_report_pipeline_contract.py
      - name: Commit bounded patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/services/academic/sync_enrollment.py backend/app/tests/test_daily_teacher_report_pipeline_contract.py MASTER_CONTEXT_DASH_CMS.md .github/workflows/apply-learning-enrollment-guard.yml
          git commit -m 'fix: preserve confirmed enrollment during learning sync'
          git push origin HEAD:fix/daily-teacher-report-pipeline
