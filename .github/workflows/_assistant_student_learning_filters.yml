name: Assistant CMS student learning filters

on:
  push:
    branches:
      - feat/import-quiz-cms-old-su26
    paths:
      - .github/workflows/_assistant_student_learning_filters.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/import-quiz-cms-old-su26
          fetch-depth: 0

      - name: Apply learner-centric filter fix
        run: python .github/scripts/_assistant_student_learning_filters.py

      - name: Verify source contract
        shell: bash
        run: |
          grep -q 'Có sinh viên chưa ghi danh' frontend/app/student-management/StudentManagementPlatformPage.tsx
          grep -q 'Có sinh viên chưa học' frontend/app/student-management/StudentManagementPlatformPage.tsx
          grep -q 'Có sinh viên tiến độ thấp' frontend/app/student-management/StudentManagementPlatformPage.tsx
          grep -q 'Có sinh viên điểm thấp' frontend/app/student-management/StudentManagementPlatformPage.tsx
          grep -q 'learning_status_counts' backend/app/services/academic_service.py

      - name: Install backend dependencies
        run: pip install -q -r backend/requirements.txt

      - name: Backend focused verification
        env:
          PYTHONPATH: backend
        run: |
          python -m py_compile \
            backend/app/services/academic_service.py \
            backend/app/schemas/academic.py \
            backend/app/tests/test_student_management_learning_filters.py
          pytest -q backend/app/tests/test_student_management_learning_filters.py
          ruff check --select E9,F63,F7,F82 \
            backend/app/services/academic_service.py \
            backend/app/schemas/academic.py \
            backend/app/tests/test_student_management_learning_filters.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Commit verified fixes and remove helper files
        shell: bash
        run: |
          rm -f .github/workflows/_assistant_student_learning_filters.yml .github/scripts/_assistant_student_learning_filters.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/app/services/academic_service.py \
            backend/app/schemas/academic.py \
            backend/app/tests/test_student_management_learning_filters.py \
            frontend/app/student-management/StudentManagementPlatformPage.tsx \
            frontend/types/index.ts \
            .github/workflows/_assistant_student_learning_filters.yml \
            .github/scripts/_assistant_student_learning_filters.py
          git diff --cached --check
          git commit -m "feat: add learner-centric CMS student filters"
          git push origin HEAD:feat/import-quiz-cms-old-su26
