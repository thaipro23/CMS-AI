name: Temporary RBAC finalize v3

on:
  push:
    branches:
      - feat/import-quiz-cms-old-su26
    paths:
      - .github/workflows/tmp-rbac-finalize-v3.yml

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/import-quiz-cms-old-su26
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements-runtime.txt
            backend/requirements-ci.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend CI dependencies
        run: python -m pip install -r backend/requirements-ci.txt

      - name: Reuse validated implementation scripts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          workflow = yaml.safe_load(Path('.github/workflows/tmp-rbac-finalize-v2.yml').read_text(encoding='utf-8'))
          steps = workflow['jobs']['verify-and-commit']['steps']
          wanted = {
              'Apply users RBAC UI implementation',
              'Write RBAC regression contract',
              'Refresh legacy broad-campus test contract',
          }
          for step in steps:
              if step.get('name') in wanted:
                  subprocess.run(step['run'], shell=True, check=True, executable='/bin/bash')
          page = Path('frontend/app/users/page.tsx')
          text = page.read_text(encoding='utf-8')
          old = 'branch: campus.branch } })))'
          new = 'branch: campus.branch || undefined } })))'
          if old not in text and new not in text:
              raise SystemExit('Expected campus branch target marker was not found')
          page.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Backend RBAC and Sonar contract tests
        run: |
          python -m pytest -q backend/app/tests/test_rbac_branch_admin_provisioning_contract.py backend/app/tests/test_rbac_admin_campus_owner_contract.py
          python -m pytest -q backend/app/tests/test_v25_9_16_7_2_64_16_5_7_2_15_sonar_worker_bank_kpi.py
      - name: Backend fatal checks
        working-directory: backend
        run: |
          python -m compileall -q app
          ruff check app --select E9,F63,F7,F82
      - name: Frontend quality and production build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run typecheck
          npm run build
          test -f .next/standalone/server.js
      - name: Diff integrity
        run: git diff --check
      - name: Update handoff context
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('MASTER_CONTEXT_DASH_CMS.md')
          t = p.read_text(encoding='utf-8')
          marker = '## 2026-09-12 — RBAC branch admins and email-first CMS provisioning'
          block = '''\n\n## 2026-09-12 — RBAC branch admins and email-first CMS provisioning\n\n- Permission grant UI is email-first; CMS/Open edX username is derived from the email local-part.\n- SYSTEM_ADMIN can grant Admin Poly (`CAMPUS_OWNER + BRANCH:poly`), Admin PTCĐ (`BRANCH:ptcd`), or Admin cơ sở (`CAMPUS:<code>`).\n- Branch admins can delegate only individual campuses inside their own branch. Campus-scoped admins cannot delegate any permission. Backend remains authoritative.\n- Campus loading and picker filtering are branch-aware and the UI no longer deduplicates only by campus_code.\n- CMS identity is provisioned/verified before RBAC assignment commit. The UI reports whether the CMS account was created or already existed.\n- Regression: `backend/app/tests/test_rbac_branch_admin_provisioning_contract.py`.\n- Verification includes RBAC tests, existing Sonar source-contract tests, backend compile/Ruff fatal checks, frontend lint/typecheck/production build, standalone build assertion, and `git diff --check`.\n- External SonarQube Quality Gate is not claimed without an observed Sonar/Jenkins gate result.\n- Kubernetes deployment and production runtime verification remain separate.\n'''
          if marker not in t:
              p.write_text(t.rstrip() + block + '\n', encoding='utf-8')
          PY
      - name: Commit verified source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/users/page.tsx backend/app/tests/test_rbac_branch_admin_provisioning_contract.py backend/app/tests/test_rbac_admin_campus_owner_contract.py MASTER_CONTEXT_DASH_CMS.md
          git commit -m "fix: scope branch admins and surface CMS provisioning"
          git push origin HEAD:feat/import-quiz-cms-old-su26
