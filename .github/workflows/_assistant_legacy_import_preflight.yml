name: Assistant legacy import preflight

on:
  push:
    branches:
      - feat/import-quiz-cms-old-su26

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/import-quiz-cms-old-su26
          fetch-depth: 0

      - name: Patch legacy import preflight
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/services/question_bank/legacy_quiz_import.py')
          text = path.read_text(encoding='utf-8')

          import_anchor = 'from app.services.object_storage import ObjectStorage, StorageError, get_object_storage\nfrom app.services.question_bank.helpers import safe_upload_filename\n'
          import_replacement = 'from app.services.object_storage import ObjectStorage, StorageError, get_object_storage\nfrom app.services.openedx_exporter import validate_question_for_olx\nfrom app.services.question_bank.helpers import safe_upload_filename\n'
          if import_anchor not in text:
              raise SystemExit('legacy import validator import anchor not found')
          text = text.replace(import_anchor, import_replacement, 1)

          helper_anchor = "\n\ndef _chapter_number(sheet_name: str, sheet_index: int) -> tuple[int, str | None]:\n"
          helper = '''\n\ndef _preflight_legacy_question_for_bank(\n    *,\n    question_type: str,\n    question_text: str,\n    difficulty: str,\n    content: dict[str, Any],\n) -> None:\n    """Run the same structural guard used before Open edX publish during import preview.\n\n    Legacy Excel questions must fail while the teacher is still in the import\n    workflow, before any Question row is written to the bank. Bank/release\n    validation remains in place as defense in depth.\n    """\n    probe = Question(\n        course_id='bank:legacy-import-preflight',\n        difficulty=difficulty,\n        question_type=question_type,\n        question_text=question_text,\n        option_a='',\n        option_b='',\n        option_c='',\n        option_d='',\n        correct_answer='A',\n        explanation='',\n        source_ref='legacy_quiz_excel_preflight',\n        source_type='legacy_quiz_excel',\n        status='pending_review',\n    )\n    apply_canonical_content(probe, question_type, content)\n    validate_question_for_olx(probe)\n\n\ndef _chapter_number(sheet_name: str, sheet_index: int) -> tuple[int, str | None]:\n'''
          if helper_anchor not in text:
              raise SystemExit('legacy import helper anchor not found')
          text = text.replace(helper_anchor, helper, 1)

          validation_anchor = '''        except ValueError as exc:\n            content = {'schema_version': 2, 'response': response}\n            question_errors.append(_error(\n                'INVALID_QUESTION',\n                str(exc),\n                workbook=workbook_name,\n                sheet=worksheet.title,\n                row=row,\n            ))\n\n        question = {\n'''
          validation_replacement = '''        except ValueError as exc:\n            content = {'schema_version': 2, 'response': response}\n            question_errors.append(_error(\n                'INVALID_QUESTION',\n                str(exc),\n                workbook=workbook_name,\n                sheet=worksheet.title,\n                row=row,\n            ))\n\n        if not question_errors:\n            try:\n                _preflight_legacy_question_for_bank(\n                    question_type=qtype,\n                    question_text=prompt,\n                    difficulty=difficulty,\n                    content=content,\n                )\n            except ValueError as exc:\n                question_errors.append(_error(\n                    'BANK_PREFLIGHT_FAILED',\n                    f'Câu chưa đạt kiểm tra cấu trúc kho đề/Open edX: {exc}',\n                    workbook=workbook_name,\n                    sheet=worksheet.title,\n                    row=row,\n                    field='QUESTION',\n                ))\n\n        question = {\n'''
          if validation_anchor not in text:
              raise SystemExit('legacy import validation insertion anchor not found')
          text = text.replace(validation_anchor, validation_replacement, 1)
          path.write_text(text, encoding='utf-8')

          ui = Path('frontend/app/import-quiz-cms-old/page.tsx')
          ui_text = ui.read_text(encoding='utf-8')
          ui_anchor = "  INVALID_QUESTION: 'Câu hỏi không hợp lệ',\n"
          ui_replacement = "  INVALID_QUESTION: 'Câu hỏi không hợp lệ',\n  BANK_PREFLIGHT_FAILED: 'Câu chưa đạt kiểm tra kho đề/CMS',\n"
          if ui_anchor not in ui_text:
              raise SystemExit('legacy UI error label anchor not found')
          ui.write_text(ui_text.replace(ui_anchor, ui_replacement, 1), encoding='utf-8')

          test_path = Path('backend/app/tests/test_legacy_quiz_cms_old_import.py')
          test_text = test_path.read_text(encoding='utf-8')
          test_anchor = "\ndef test_dropdown_olx_keeps_order_and_rejects_blank_mismatch() -> None:\n"
          test_insert = '''\ndef test_bank_publish_preflight_failure_is_reported_before_import(monkeypatch) -> None:\n    raw = _workbook_bytes([\n        {'question': 'Câu hợp lệ về cấu trúc nhưng bị publish guard từ chối?', 'type': 0, 'threshold': 1, 'correct': 'A'},\n    ])\n\n    def reject_publish_contract(_question):\n        raise ValueError('publish contract rejected')\n\n    monkeypatch.setattr(\n        'app.services.question_bank.legacy_quiz_import.validate_question_for_olx',\n        reject_publish_contract,\n    )\n    parsed = parse_legacy_quiz_workbook(raw, filename='MEC005.xlsx')\n    question = parsed['sheets'][0]['questions'][0]\n    assert any(item['code'] == 'BANK_PREFLIGHT_FAILED' for item in question['errors'])\n    assert any(item['code'] == 'BANK_PREFLIGHT_FAILED' for item in parsed['errors'])\n\n\ndef test_dropdown_olx_keeps_order_and_rejects_blank_mismatch() -> None:\n'''
          if test_anchor not in test_text:
              raise SystemExit('legacy test insertion anchor not found')
          test_path.write_text(test_text.replace(test_anchor, test_insert, 1), encoding='utf-8')
          PY

      - name: Verify targeted backend and frontend source
        shell: bash
        run: |
          python -m py_compile \
            backend/app/services/question_bank/legacy_quiz_import.py \
            backend/app/tests/test_legacy_quiz_cms_old_import.py
          grep -F "BANK_PREFLIGHT_FAILED" backend/app/services/question_bank/legacy_quiz_import.py
          grep -F "BANK_PREFLIGHT_FAILED" frontend/app/import-quiz-cms-old/page.tsx
          git diff --check

      - name: Run focused importer tests
        shell: bash
        run: |
          python -m pip install --upgrade pip >/dev/null
          pip install -r backend/requirements.txt >/dev/null
          PYTHONPATH=backend pytest -q backend/app/tests/test_legacy_quiz_cms_old_import.py

      - name: Commit source changes and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_assistant_legacy_import_preflight.yml
          git add backend/app/services/question_bank/legacy_quiz_import.py \
                  backend/app/tests/test_legacy_quiz_cms_old_import.py \
                  frontend/app/import-quiz-cms-old/page.tsx
          git commit -m "fix: validate legacy quiz errors before bank import"
          git push origin HEAD:feat/import-quiz-cms-old-su26
