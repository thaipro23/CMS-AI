name: Assistant department search and worker contract fix

on:
  push:
    branches:
      - feat/import-quiz-cms-old-su26
    paths:
      - .github/workflows/_assistant_department_search_worker_fix.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/import-quiz-cms-old-su26
          fetch-depth: 0

      - name: Apply focused fixes
        run: python .github/scripts/_assistant_department_search_worker_fix.py

      - name: Verify source contracts
        shell: bash
        run: |
          grep -q "subjectDepartmentIds.has(department.id)" frontend/app/bank/_components/pages/DepartmentsPage.tsx
          grep -q 'placeholder="Tìm bộ môn hoặc môn học..."' frontend/app/bank/_components/pages/DepartmentsPage.tsx
          ! grep -q 'className="subject-quick-search"' frontend/app/bank/_components/pages/DepartmentsPage.tsx
          ! grep -q 'hideSearch' frontend/app/bank/_components/pages/DepartmentsPage.tsx
          grep -q "_version_at_least(contract, self.CONNECTOR_MIN_CONTRACT_VERSION)" backend/app/services/academic_service.py

      - name: Install backend dependencies
        run: pip install -q -r backend/requirements.txt

      - name: Backend focused verification
        env:
          PYTHONPATH: backend
        run: |
          python -m py_compile \
            backend/app/services/academic_service.py \
            backend/app/tests/test_academic_connector_contract_compat.py
          pytest -q backend/app/tests/test_academic_connector_contract_compat.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Commit verified fixes and remove helper files
        shell: bash
        run: |
          test -f .github/workflows/_assistant_department_search_worker_fix.yml
          test -f .github/scripts/_assistant_department_search_worker_fix.py
          rm -f .github/workflows/_assistant_department_search_worker_fix.yml .github/scripts/_assistant_department_search_worker_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend/app/bank/_components/pages/DepartmentsPage.tsx \
            backend/app/services/academic_service.py \
            backend/app/tests/test_academic_connector_contract_compat.py \
            .github/workflows/_assistant_department_search_worker_fix.yml \
            .github/scripts/_assistant_department_search_worker_fix.py
          git diff --cached --check
          git commit -m "fix: restore table search and accept newer connector contract"
          git push origin HEAD:feat/import-quiz-cms-old-su26
