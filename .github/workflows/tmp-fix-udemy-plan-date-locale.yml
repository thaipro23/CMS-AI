name: Temporary Udemy plan date locale fix

on:
  push:
    branches:
      - feat/import-quiz-cms-old-su26
    paths:
      - .github/workflows/tmp-fix-udemy-plan-date-locale.yml

permissions:
  contents: write

jobs:
  red-green-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/import-quiz-cms-old-su26
          fetch-depth: 0

      - name: RED - confirm current template is locale sensitive
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('backend/app/services/academic/udemy_plan.py').read_text(encoding='utf-8')
          assert "sheet.cell(row=3, column=col).number_format = 'dd/mm/yyyy'" in source
          assert "sample[10] = date(2026, 9, 21)" in source
          print('Confirmed current template uses locale-sensitive Excel date cells')
          PY

      - name: Apply locale-safe Udemy template patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/services/academic/udemy_plan.py')
          source = path.read_text(encoding='utf-8')
          old = """        sample = [1, 'Fall 2026', 'Block 1', 'SOF3032', 'SOF3032 - Môn Udemy mẫu', 6]\n        for week in range(1, 11):\n            sample.extend([None, None])\n        sample[6] = date(2026, 9, 7)\n        sample[7] = 20\n        sample[8] = date(2026, 9, 14)\n        sample[9] = 40\n        sample[10] = date(2026, 9, 21)\n        sample[11] = 60\n        sample[12] = date(2026, 9, 28)\n        sample[13] = 80\n        sample[14] = date(2026, 10, 5)\n        sample[15] = 100\n        for col, value in enumerate(sample, 1):\n            sheet.cell(row=3, column=col, value=value)\n        for col in range(7, 27, 2):\n            sheet.cell(row=3, column=col).number_format = 'dd/mm/yyyy'\n"""
          new = """        sample = [1, 'Fall 2026', 'Block 1', 'SOF3032', 'SOF3032 - Môn Udemy mẫu', 6]\n        for week in range(1, 11):\n            sample.extend([None, None])\n        # Keep deadline cells as explicit dd/mm/yyyy text. Excel/LibreOffice can\n        # otherwise reinterpret an ambiguous value such as 03/10/2026 using the\n        # workstation locale (MM/DD/YYYY) before the backend ever sees the file.\n        sample_deadlines = [\n            ('19/09/2026', 20),\n            ('26/09/2026', 35),\n            ('03/10/2026', 50),\n            ('10/10/2026', 75),\n            ('17/10/2026', 90),\n            ('24/10/2026', 100),\n        ]\n        for index, (deadline_text, progress) in enumerate(sample_deadlines):\n            sample[6 + index * 2] = deadline_text\n            sample[7 + index * 2] = progress\n        for col, value in enumerate(sample, 1):\n            sheet.cell(row=3, column=col, value=value)\n        for col in range(7, 27, 2):\n            # Text is intentional: parse_workbook() owns the locale-independent\n            # dd/mm/yyyy conversion and also still accepts genuine Excel dates.\n            sheet.cell(row=3, column=col).number_format = '@'\n"""
          if source.count(old) != 1:
              raise SystemExit(f'Expected one build_template block, got {source.count(old)}')
          source = source.replace(old, new, 1)
          source = source.replace(
              "'Deadline nhập dạng ngày Excel, dd/mm/yyyy hoặc yyyy-mm-dd.',",
              "'Deadline nhập dạng chuỗi dd/mm/yyyy (ví dụ 03/10/2026). Không đổi cột Week sang định dạng ngày theo locale; backend cũng vẫn đọc được ngày Excel thật.',",
              1,
          )
          path.write_text(source, encoding='utf-8')
          PY

      - name: GREEN - verify locale-safe source contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('backend/app/services/academic/udemy_plan.py').read_text(encoding='utf-8')
          assert "('03/10/2026', 50)" in source
          assert "sheet.cell(row=3, column=col).number_format = '@'" in source
          assert "'%d/%m/%Y'" in source
          assert "from_excel(value, cell.parent.parent.epoch)" in source
          assert "sample[10] = date(2026, 9, 21)" not in source
          print('Locale-safe template and backward-compatible parser contract verified')
          PY
          python -m py_compile backend/app/services/academic/udemy_plan.py

      - name: Update project context
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('MASTER_CONTEXT_DASH_CMS.md')
          marker = '## 2026-09-11 — Udemy plan date locale regression'
          note = '''\n\n## 2026-09-11 — Udemy plan date locale regression\n- Fixed generated Udemy plan template so Week deadline cells are explicit `dd/mm/yyyy` text (`@`) instead of locale-sensitive Excel date cells.\n- `03/10/2026` therefore remains 3 October 2026 even on workstations using an MM/DD locale.\n- Backend parser remains backward-compatible with real Excel date cells, serial values, `dd/mm/yyyy`, and ISO dates.\n- Regression test added at `backend/app/tests/test_udemy_plan_date_locale_regression.py`; targeted local suite was verified before the GitHub source patch.\n'''
          text = path.read_text(encoding='utf-8')
          if marker not in text:
              path.write_text(text.rstrip() + note, encoding='utf-8')
          PY

      - name: Commit source fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/services/academic/udemy_plan.py MASTER_CONTEXT_DASH_CMS.md
          git commit -m "fix: make Udemy plan dates locale safe"
          git push origin HEAD:feat/import-quiz-cms-old-su26
