name: Temporary AP resync context cleanup

on:
  push:
    branches:
      - feat/import-quiz-cms-old-su26
    paths:
      - .github/workflows/tmp-ap-platform-resync-audit-fix.yml

permissions:
  contents: write

jobs:
  update-context-and-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/import-quiz-cms-old-su26
          fetch-depth: 0

      - name: Append verified handoff context
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('MASTER_CONTEXT_DASH_CMS.md')
          text = path.read_text(encoding='utf-8')
          marker = '## 2026-09-11 — Udemy to CMS AP reconciliation and audit aggregation'
          block = '''\n\n## 2026-09-11 — Udemy to CMS AP reconciliation and audit aggregation\n\n- Verified branch source fix commit: `689d871a766404f02425cc14522117d9f763fd09`.\n- Switching a subject delivery from `udemy` to `cms` now preserves platform history and sets `metadata_json.ap_reconcile_required=true` with reason `learning_platform_changed_udemy_to_cms`.\n- The AP Celery worker now uses `app.services.academic.ap_importer.AcademicImportService`, so a subsequent AP import reconciles AP-owned class teacher/student links instead of only upserting.\n- The reconcile marker is cleared only after a non-dry-run AP sync finishes with `status=completed` and `counters.errors == 0`. Partial/error/dry-run syncs do not clear it.\n- Per-class success audit rows are kept for manual class operations, but bulk/scheduled child success rows are suppressed. Failure audit rows remain per child.\n- The daily 05:00 Asia/Ho_Chi_Minh score scheduler writes one summary audit action `academic.sync_all_student_scores` with success/failed status.\n- Regression files: `backend/app/tests/test_ap_platform_resync_and_class_audit_regression.py` and `backend/app/tests/test_ap_platform_resync_integration.py`.\n- GitHub Actions RED→GREEN verification run `34604486553` completed successfully: RED reproduced before patch, GREEN passed after patch, and `py_compile` passed for changed production modules.\n- This verifies source/tests only. Kubernetes deployment and production runtime verification have not been performed in this change.\n'''
          if marker not in text:
              path.write_text(text.rstrip() + block + '\n', encoding='utf-8')
          PY

      - name: Remove temporary workflow
        run: git rm .github/workflows/tmp-ap-platform-resync-audit-fix.yml

      - name: Commit context and cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: record AP reconciliation verification"
          git push origin HEAD:feat/import-quiz-cms-old-su26
