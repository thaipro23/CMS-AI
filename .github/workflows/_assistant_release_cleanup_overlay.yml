name: Assistant release cleanup and overlay

on:
  push:
    branches:
      - feat/import-quiz-cms-old-su26
    paths:
      - .github/workflows/_assistant_release_cleanup_overlay.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/import-quiz-cms-old-su26
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/_assistant_release_cleanup_overlay.py

      - name: Install backend dependencies
        run: pip install -q -r backend/requirements.txt

      - name: Backend focused verification
        env:
          PYTHONPATH: backend
        run: |
          python -m py_compile \
            backend/app/services/question_bank/release_publish.py \
            backend/app/services/question_bank/generation_review.py \
            backend/app/tests/test_release_snapshot_auto_cleanup.py
          pytest -q backend/app/tests/test_release_snapshot_auto_cleanup.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Commit verified fixes and remove helper files
        shell: bash
        run: |
          rm -f .github/workflows/_assistant_release_cleanup_overlay.yml .github/scripts/_assistant_release_cleanup_overlay.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/app/services/question_bank/release_publish.py \
            backend/app/services/question_bank/generation_review.py \
            backend/app/tests/test_release_snapshot_auto_cleanup.py \
            frontend/app/bank/_components/pages/ChapterWorkspacePage.tsx \
            frontend/app/globals.css \
            .github/workflows/_assistant_release_cleanup_overlay.yml \
            .github/scripts/_assistant_release_cleanup_overlay.py
          git diff --cached --check
          git commit -m "fix: refresh release snapshot and prevent import overlay"
          git push origin HEAD:feat/import-quiz-cms-old-su26
