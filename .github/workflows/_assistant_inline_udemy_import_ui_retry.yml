name: Assistant inline Udemy and isolated import UI retry

on:
  push:
    branches:
      - feat/import-quiz-cms-old-su26
    paths:
      - .github/workflows/_assistant_inline_udemy_import_ui_retry.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/import-quiz-cms-old-su26
          fetch-depth: 0

      - name: Repair helper and apply scoped UI fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/_assistant_inline_udemy_and_import_page.py')
          text = p.read_text()
          old = '''class_page = replace_once(
              "      {isUdemyClass ? <InlineNotice'''
          new = '''class_page = replace_once(
              class_page,
              "      {isUdemyClass ? <InlineNotice'''
          if old not in text:
              raise SystemExit('repair marker not found')
          p.write_text(text.replace(old, new, 1))
          PY
          python .github/scripts/_assistant_inline_udemy_and_import_page.py

      - name: Verify source contracts and global CSS isolation
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'UdemyClassProgressPanel' 'frontend/app/student-management/classes/[classId]/page.tsx'
          grep -q 'getUdemyProgressStudents' frontend/components/student-management/UdemyClassProgressPanel.tsx
          grep -q 'classId' frontend/components/student-management/UdemyClassProgressPanel.tsx
          ! grep -q 'Xem tiến độ Udemy' 'frontend/app/student-management/classes/[classId]/page.tsx'
          grep -q 'EnterpriseScreenHeader' frontend/app/import-quiz-cms-old/page.tsx
          grep -q 'WorkspaceSection' frontend/app/import-quiz-cms-old/page.tsx
          grep -q 'page.module.css' frontend/app/import-quiz-cms-old/page.tsx
          test -f frontend/app/import-quiz-cms-old/page.module.css
          ! grep -q 'BankWorkflowStepper' frontend/app/import-quiz-cms-old/page.tsx
          ! grep -q 'BankPageIdentity' frontend/app/import-quiz-cms-old/page.tsx
          ! grep -q 'legacy-import' frontend/app/globals.css
          ! grep -q 'legacy-quiz-import' frontend/app/globals.css
          grep -q 'Có sinh viên chưa ghi danh' frontend/app/student-management/StudentManagementPlatformPage.tsx
          grep -q 'Có sinh viên chưa học' frontend/app/student-management/StudentManagementPlatformPage.tsx
          grep -q 'Có sinh viên điểm thấp' frontend/app/student-management/StudentManagementPlatformPage.tsx
          git diff --check

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Commit verified changes and remove helper files
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/_assistant_inline_udemy_import_ui.yml \
            .github/workflows/_assistant_inline_udemy_import_ui_retry.yml \
            .github/scripts/_assistant_inline_udemy_and_import_page.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            'frontend/app/student-management/classes/[classId]/page.tsx' \
            frontend/components/student-management/UdemyClassProgressPanel.tsx \
            frontend/app/import-quiz-cms-old/page.tsx \
            frontend/app/import-quiz-cms-old/page.module.css \
            frontend/app/globals.css \
            .github/workflows/_assistant_inline_udemy_import_ui.yml \
            .github/workflows/_assistant_inline_udemy_import_ui_retry.yml \
            .github/scripts/_assistant_inline_udemy_and_import_page.py
          git diff --cached --check
          git commit -m "fix: show Udemy class progress inline and isolate import UI"
          git push origin HEAD:feat/import-quiz-cms-old-su26
