name: Apply email privacy hardening

on:
  push:
    branches: [feat/import-quiz-cms-old-su26]
    paths:
      - '.github/workflows/apply-email-privacy.yml'
      - 'scripts/apply_email_privacy.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/import-quiz-cms-old-su26
          fetch-depth: 0
      - name: Apply source patch
        run: python scripts/apply_email_privacy.py
      - name: Install backend CI dependencies
        run: python -m pip install -q -r backend/requirements.txt
      - name: Backend syntax and targeted tests
        run: |
          python -m py_compile backend/app/core/privacy.py backend/app/services/academic/progress_email.py backend/app/schemas/academic.py backend/app/schemas/rbac.py backend/app/services/openedx_student_insight.py backend/app/services/academic_service.py backend/app/services/academic/teacher_report.py backend/app/services/learning_analytics/analytics_core_service.py backend/app/services/academic/identity.py backend/app/services/bank_search.py backend/app/services/academic/udemy_progress.py backend/app/api/routes/academic.py
          cd backend
          pytest -q app/tests/test_email_privacy_contract.py app/tests/test_academic_progress_email.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend lint typecheck build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run typecheck
          npm run build
      - name: Privacy regression scan
        run: |
          python - <<'PY'
          from pathlib import Path
          checks = {
              'frontend/app/student-management/classes/[classId]/page.tsx': ["<small>{student.email || 'Chưa có email'}</small>"],
              'frontend/app/subject-management/[deliveryId]/udemy/page.tsx': ['<small>{row.email}</small>'],
              'frontend/components/student-management/UdemyClassProgressPanel.tsx': ['{row.email ? <small>{row.email}</small> : null}'],
              'frontend/app/teacher-management/TeacherManagementPlatformPage.tsx': ['${item.teacher_email}'],
              'frontend/app/users/page.tsx': ["<small>{item.email || 'Chưa có email'}</small>"],
          }
          failed = []
          for path, forbidden in checks.items():
              text = Path(path).read_text(encoding='utf-8')
              for marker in forbidden:
                  if marker in text:
                      failed.append(f'{path}: {marker}')
          if failed:
              raise SystemExit('Raw email display regression: ' + '; '.join(failed))
          PY
      - name: Commit verified patch
        run: |
          rm -f .github/workflows/audit-email-rendering.yml .github/workflows/apply-email-privacy.yml scripts/apply_email_privacy.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: mask email displays and update progress reminder'
          git push origin HEAD:feat/import-quiz-cms-old-su26
