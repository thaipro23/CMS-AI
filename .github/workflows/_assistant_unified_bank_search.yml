name: Assistant unified bank search

on:
  push:
    branches:
      - feat/import-quiz-cms-old-su26
    paths:
      - .github/workflows/_assistant_unified_bank_search.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/import-quiz-cms-old-su26
          fetch-depth: 0

      - name: Unify department and subject search
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('frontend/app/bank/_components/pages/DepartmentsPage.tsx')
          text = page.read_text()
          text = text.replace("  const [subjectQuery, setSubjectQuery] = useState('')\n", "")
          text = text.replace("    const query = subjectQuery.trim()", "    const query = search.trim()")
          text = text.replace("  }, [headers, subjectQuery])", "  }, [headers, search])")
          text = text.replace('<section className="subject-quick-search" aria-label="Tìm nhanh môn học">', '<section className="subject-quick-search" aria-label="Tìm bộ môn hoặc môn học">')
          text = text.replace('<div><span>Truy cập nhanh</span><b>Tìm môn học</b></div>\n        <small>Nhập mã hoặc tên môn để đi thẳng tới danh sách phiên bản.</small>', '<div><span>Tìm kiếm</span><b>Tìm bộ môn hoặc môn học</b></div>\n        <small>Một ô tìm kiếm cho cả bảng bộ môn và truy cập nhanh môn học.</small>')
          text = text.replace('            value={subjectQuery}', '            value={search}')
          text = text.replace('            onChange={(event) => setSubjectQuery(event.target.value)}', '            onChange={(event) => updateTableState({ q: event.target.value })}')
          text = text.replace('            placeholder="Nhập ít nhất 2 ký tự, ví dụ MEC229 hoặc Nghiệp vụ Bar..."', '            placeholder="Tìm bộ môn hoặc môn học, ví dụ CNTT, Cơ điện, MEC229..."')
          text = text.replace('            aria-label="Mã hoặc tên môn học"', '            aria-label="Tìm bộ môn hoặc môn học"')
          text = text.replace("          {subjectQuery ? <button type=\"button\" className=\"icon-button\" aria-label=\"Xóa từ khóa\" onClick={() => setSubjectQuery('')}>×</button> : null}", "          {search ? <button type=\"button\" className=\"icon-button\" aria-label=\"Xóa từ khóa\" onClick={() => updateTableState({ q: '' })}>×</button> : null}")
          text = text.replace('{subjectQuery.trim().length >= 2 && !subjectSearching && !subjectSearchError ?', '{search.trim().length >= 2 && !subjectSearching && !subjectSearchError ?')
          text = text.replace('        placeholder="Tìm bộ môn..."\n      />', '        placeholder="Tìm bộ môn hoặc môn học..."\n        hideSearch\n      />')
          for token in ('subjectQuery', 'setSubjectQuery'):
              if token in text:
                  raise SystemExit(f'legacy duplicate search token remains: {token}')
          if 'hideSearch' not in text:
              raise SystemExit('DepartmentsPage did not opt into hidden duplicate search')
          page.write_text(text)

          shared = Path('frontend/app/bank/_components/shared.tsx')
          s = shared.read_text()
          old = '''  totalCount,\n  action,\n}: {\n  search: string'''
          new = '''  totalCount,\n  action,\n  hideSearch = false,\n}: {\n  search: string'''
          if old not in s:
              raise SystemExit('BankTableToolbar argument marker not found')
          s = s.replace(old, new, 1)
          old = '''  totalCount: number\n  action?: React.ReactNode\n}) {'''
          new = '''  totalCount: number\n  action?: React.ReactNode\n  hideSearch?: boolean\n}) {'''
          if old not in s:
              raise SystemExit('BankTableToolbar type marker not found')
          s = s.replace(old, new, 1)
          old = '''    <label className="bank-table-filter-field bank-table-search-field">\n      <span>Tìm kiếm</span>'''
          new = '''    {!hideSearch ? <label className="bank-table-filter-field bank-table-search-field">\n      <span>Tìm kiếm</span>'''
          if old not in s:
              raise SystemExit('BankTableToolbar search start marker not found')
          s = s.replace(old, new, 1)
          old = '''      <input className="input" aria-label={placeholder} value={search} onChange={(event) => setSearch(event.target.value)} placeholder={placeholder} />\n    </label>'''
          new = '''      <input className="input" aria-label={placeholder} value={search} onChange={(event) => setSearch(event.target.value)} placeholder={placeholder} />\n    </label> : null}'''
          if old not in s:
              raise SystemExit('BankTableToolbar search end marker not found')
          s = s.replace(old, new, 1)
          shared.write_text(s)
          PY

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Commit verified unified search and remove helper workflow
        shell: bash
        run: |
          rm -f .github/workflows/_assistant_unified_bank_search.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/bank/_components/pages/DepartmentsPage.tsx frontend/app/bank/_components/shared.tsx .github/workflows/_assistant_unified_bank_search.yml
          git diff --cached --check
          git commit -m "fix: unify department and subject search"
          git push origin HEAD:feat/import-quiz-cms-old-su26

# trigger 3
