name: AI Server CI

on:
  push:
    branches: [main, master, develop, 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: 25.9.16.7.2.64.16.5.7.2.4
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  npm-lockfile-registry:
    name: Public npm lockfile contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reject private/internal registry URLs
        run: ./scripts/npm-public-registry-lockfile-report.sh /tmp/npm-public-registry
      - name: Upload registry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-public-registry-evidence
          path: /tmp/npm-public-registry

  backend-quality:
    name: Backend quality and integration
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ai_openedx_ci
          POSTGRES_USER: ai_ci
          POSTGRES_PASSWORD: ai_ci_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ai_ci -d ai_openedx_ci"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DEBUG: 'false'
      AUTO_CREATE_TABLES: 'false'
      DATABASE_URL: postgresql+psycopg://ai_ci:ai_ci_password@127.0.0.1:5432/ai_openedx_ci
      TEST_DATABASE_URL: postgresql+psycopg://ai_ci:ai_ci_password@127.0.0.1:5432/ai_openedx_ci
      REDIS_URL: redis://127.0.0.1:6379/15
      METRICS_ENABLED: 'false'
      ALLOW_DEMO_ROLE_HEADER: 'false'
      MOCK_LLM: 'true'
      USE_MOCK_OPENEDX: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements-runtime.txt
            backend/requirements-ci.txt
      - name: Install backend CI dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Compile and Ruff fatal checks
        run: |
          python -m compileall -q app
          ruff check app --select E9,F63,F7,F82
      - name: Upgrade disposable PostgreSQL database
        run: alembic -c alembic.ini upgrade head
      - name: Run current behavior and integration tests
        run: ../scripts/ci-backend-tests.sh
      - name: Verify migration downgrade and re-upgrade
        run: |
          alembic -c alembic.ini downgrade 0052_v25_9_16_7_2_27
          alembic -c alembic.ini upgrade head
      - name: Run source/runtime gates
        working-directory: .
        run: |
          ./scripts/backend-runtime-name-audit.sh /tmp/backend-runtime-audit
          ./scripts/ci-e2e-container-hardening-report.sh /tmp/ci-hardening
      - name: Upload backend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-ci-evidence
          path: |
            /tmp/backend-runtime-audit
            /tmp/ci-hardening

  frontend:
    needs: npm-lockfile-registry
    name: Frontend type, lint and production build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Assert standalone build
        run: test -f .next/standalone/server.js

  browser-e2e:
    needs: npm-lockfile-registry
    name: Playwright browser smoke
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ci
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore

  container-hardening:
    needs: npm-lockfile-registry
    name: Production images and Compose contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production images
        run: |
          docker build -f backend/Dockerfile.prod -t ai-server-backend-ci .
          docker build -f frontend/Dockerfile -t ai-server-frontend-ci frontend
      - name: Verify non-root immutable runtime images
        run: |
          docker run --rm --entrypoint sh ai-server-backend-ci -c 'test "$(id -u)" = 10001 && test ! -w /app/app && ! command -v gcc'
          docker run --rm --entrypoint sh ai-server-frontend-ci -c 'test "$(id -u)" = 10001 && test ! -w /app/server.js'
      - name: Validate Compose
        run: |
          cp .env.production.example .env.production
          POSTGRES_PASSWORD=ci_password APP_VERSION="$APP_VERSION" docker compose -f docker-compose.prod.yml --env-file .env.production config >/tmp/compose.resolved.yml
          grep -q 'service_completed_successfully' /tmp/compose.resolved.yml
          grep -q 'no-new-privileges:true' /tmp/compose.resolved.yml
      - name: Upload resolved Compose
        uses: actions/upload-artifact@v4
        with:
          name: compose-resolved
          path: /tmp/compose.resolved.yml
