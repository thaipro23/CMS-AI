name: Temporary teacher report outerjoin fix

on:
  push:
    branches:
      - feat/import-quiz-cms-old-su26
    paths:
      - .github/workflows/tmp-fix-teacher-report-outerjoin.yml
      - backend/app/tests/test_teacher_report_outerjoin_contract.py

permissions:
  contents: write

jobs:
  red-green-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/import-quiz-cms-old-su26
          fetch-depth: 0

      - name: RED - regression test must reproduce current bug
        shell: bash
        run: |
          set +e
          python backend/app/tests/test_teacher_report_outerjoin_contract.py
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "Regression test unexpectedly passed before the fix"
            exit 1
          fi
          echo "Confirmed regression test fails against malformed source"

      - name: Apply minimal source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/services/academic/teacher_report.py')
          source = path.read_text(encoding='utf-8')

          old_query = """                AcademicStudent,\n                OpenEdXUserMapping,\n    UdemyStudentProgress,\n            ).join("""
          new_query = """                AcademicStudent,\n                OpenEdXUserMapping,\n            ).join("""

          old_join = """            ).outerjoin(\n                OpenEdXUserMapping,\n    UdemyStudentProgress,\n                OpenEdXUserMapping.student_id == AcademicClassStudent.student_id,\n            ).filter("""
          new_join = """            ).outerjoin(\n                OpenEdXUserMapping,\n                OpenEdXUserMapping.student_id == AcademicClassStudent.student_id,\n            ).filter("""

          if source.count(old_query) != 1:
              raise SystemExit(f'Expected exactly one malformed query entity block, got {source.count(old_query)}')
          if source.count(old_join) != 1:
              raise SystemExit(f'Expected exactly one malformed outerjoin block, got {source.count(old_join)}')

          source = source.replace(old_query, new_query, 1).replace(old_join, new_join, 1)
          path.write_text(source, encoding='utf-8')
          PY

      - name: GREEN - regression test passes
        run: python backend/app/tests/test_teacher_report_outerjoin_contract.py

      - name: Syntax check teacher report module
        run: python -m py_compile backend/app/services/academic/teacher_report.py

      - name: Commit source fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/services/academic/teacher_report.py
          git commit -m "fix: repair async teacher report student watch join"
          git push origin HEAD:feat/import-quiz-cms-old-su26
