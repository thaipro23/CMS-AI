# Use this only if Nginx is the single reverse proxy owning ports 80/443.
# Do not run this Nginx on the host if Tutor Caddy already owns 80/443.

upstream ai_frontend_upstream {
    server ai-frontend:3000;
}

upstream ai_backend_upstream {
    server ai-backend:8000;
}

server {
    listen 80;
    server_name ai.cms-test.poly.edu.vn;

    location / {
        proxy_pass http://ai_frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    server_name api-ai.cms-test.poly.edu.vn;

    location / {
        proxy_pass http://ai_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
