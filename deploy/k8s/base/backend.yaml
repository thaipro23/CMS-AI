apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-server-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-server-backend
  template:
    metadata:
      labels:
        app: ai-server-backend
    spec:
      imagePullSecrets:
        - name: harbor-regcred
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: backend
          image: ai-server-backend
          imagePullPolicy: IfNotPresent
          command: ["gunicorn"]
          args:
            - app.main:app
            - -k
            - uvicorn.workers.UvicornWorker
            - -w
            - "2"
            - -b
            - 0.0.0.0:8000
            - --forwarded-allow-ips=*
            - --timeout
            - "120"
            - --graceful-timeout
            - "30"
            - --worker-tmp-dir
            - /tmp
            - --access-logfile
            - "-"
            - --error-logfile
            - "-"
            - --capture-output
          envFrom:
            - secretRef:
                name: ai-server-env
            - secretRef:
                name: ai-server-minio
          env:
            - name: LOCAL_STORAGE_PATH
              value: /app/.runtime
            - name: HOME
              value: /tmp
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: runtime
              mountPath: /app/.runtime
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: runtime
          persistentVolumeClaim:
            claimName: ai-server-runtime
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ai-server-backend
spec:
  selector:
    app: ai-server-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
