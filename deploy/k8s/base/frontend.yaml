apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-server-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-server-frontend
  template:
    metadata:
      labels:
        app: ai-server-frontend
    spec:
      imagePullSecrets:
        - name: harbor-regcred
      containers:
        - name: frontend
          image: ai-server-frontend
          imagePullPolicy: IfNotPresent
          env:
            - {name: HOME, value: /tmp}
          ports:
            - {name: http, containerPort: 3000}
          readinessProbe:
            httpGet: {path: /auth/logged-out, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /auth/logged-out, port: http}
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: next-cache, mountPath: /app/.next/cache}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
        - name: next-cache
          emptyDir: {sizeLimit: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-server-frontend
spec:
  selector:
    app: ai-server-frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
