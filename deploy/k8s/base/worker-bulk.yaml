apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-server-worker-bulk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-server-worker-bulk
  template:
    metadata:
      labels:
        app: ai-server-worker-bulk
    spec:
      imagePullSecrets:
        - name: harbor-regcred
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: worker-bulk
          image: ai-server-backend
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - >-
              exec celery -A app.worker.celery_app worker
              --loglevel=INFO --queues=sync-bulk,sync --concurrency=${CELERY_BULK_CONCURRENCY:-2}
              --prefetch-multiplier=${CELERY_WORKER_PREFETCH_MULTIPLIER:-1}
              --max-tasks-per-child=${CELERY_WORKER_MAX_TASKS_PER_CHILD:-25}
              --max-memory-per-child=${CELERY_WORKER_MAX_MEMORY_PER_CHILD_KB:-600000}
              --hostname=worker-bulk@%h
          envFrom:
            - secretRef:
                name: ai-server-env
          env:
            # Bulk lane is intentionally smaller than the fast lane.  The
            # dispatch window may keep four class jobs outstanding while only
            # two execute concurrently, leaving LMS/DB headroom for users.
            - name: CELERY_BULK_CONCURRENCY
              value: "2"
            - name: ACADEMIC_BULK_SYNC_DISPATCH_WINDOW
              value: "4"
            - name: OPENEDX_CONNECTOR_INTERNAL_BASE_URL
              value: http://lms:8000
            - name: OPENEDX_CONNECTOR_READ_RETRY_MAX_ATTEMPTS
              value: "2"
            - name: OPENEDX_CONNECTOR_READ_RETRY_BASE_SECONDS
              value: "0.5"
            - name: OPENEDX_CONNECTOR_READ_RETRY_MAX_SECONDS
              value: "1.0"
            - name: LOCAL_STORAGE_PATH
              value: /app/.runtime
            - name: HOME
              value: /tmp
          resources:
            requests: {cpu: 300m, memory: 512Mi}
            limits: {cpu: "1500m", memory: 2Gi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: runtime, mountPath: /app/.runtime}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: runtime
          persistentVolumeClaim: {claimName: ai-server-runtime}
        - name: tmp
          emptyDir: {sizeLimit: 512Mi}
