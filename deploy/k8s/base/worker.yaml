apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-server-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-server-worker
  template:
    metadata:
      labels:
        app: ai-server-worker
    spec:
      imagePullSecrets:
        - name: harbor-regcred
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: worker
          image: ai-server-backend
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - >-
              exec celery -A app.worker.celery_app worker
              --loglevel=INFO --queues=interactive,sync --concurrency=${CELERY_CONCURRENCY:-2}
              --prefetch-multiplier=${CELERY_WORKER_PREFETCH_MULTIPLIER:-1}
              --max-tasks-per-child=${CELERY_WORKER_MAX_TASKS_PER_CHILD:-25}
              --max-memory-per-child=${CELERY_WORKER_MAX_MEMORY_PER_CHILD_KB:-600000}
              --hostname=worker@%h
          envFrom:
            - secretRef:
                name: ai-server-env
          env:
            - name: LOCAL_STORAGE_PATH
              value: /app/.runtime
            - name: HOME
              value: /tmp
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: runtime, mountPath: /app/.runtime}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: runtime
          persistentVolumeClaim: {claimName: ai-server-runtime}
        - name: tmp
          emptyDir: {sizeLimit: 512Mi}
