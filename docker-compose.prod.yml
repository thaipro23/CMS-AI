services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_openedx}
      POSTGRES_USER: ${POSTGRES_USER:-ai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - ai_internal

  redis:
    image: redis:7-alpine
    container_name: ai-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - ai_internal
    extra_hosts:
      - "cms-test.poly.edu.vn:host-gateway"
      - "scms-test.poly.edu.vn:host-gateway"
      - "app.cms-test.poly.edu.vn:host-gateway"
      - "ai.cms-test.poly.edu.vn:host-gateway"
      - "api-ai.cms-test.poly.edu.vn:host-gateway"
      - "meilisearch.cms-test.poly.edu.vn:host-gateway"
      - "api_v2.poly.edu.vn:10.2.1.35"
      - "apitest.poly.edu.vn:10.2.5.8"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    container_name: ai-backend
    env_file: .env.production
    environment:
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/app/.runtime}
    restart: unless-stopped
    command: >
      sh -c "alembic -c alembic.ini upgrade head &&
      gunicorn app.main:app
      -k uvicorn.workers.UvicornWorker
      -w $${WEB_CONCURRENCY:-2}
      -b 0.0.0.0:8000
      --forwarded-allow-ips='*'
      --timeout $${WEB_TIMEOUT_SECONDS:-120}
      --graceful-timeout 30"
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - runtime_data:/app/.runtime
      - ${OPENEDX_TRACKING_LOG_HOST_DIR:-/home/thaitx3/.local/share/tutor/data/lms/logs}:/openedx-data/lms/logs:ro
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()\nPY"]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 30s
    networks:
      ai_internal:
      openedx_shared:
        aliases:
          - ai-backend
    extra_hosts:
      - "cms-test.poly.edu.vn:host-gateway"
      - "scms-test.poly.edu.vn:host-gateway"
      - "app.cms-test.poly.edu.vn:host-gateway"
      - "ai.cms-test.poly.edu.vn:host-gateway"
      - "api-ai.cms-test.poly.edu.vn:host-gateway"
      - "meilisearch.cms-test.poly.edu.vn:host-gateway"
      - "api_v2.poly.edu.vn:10.2.1.35"
      - "apitest.poly.edu.vn:10.2.5.8"

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    container_name: ai-worker
    env_file: .env.production
    environment:
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/app/.runtime}
    restart: unless-stopped
    command: >
      celery -A app.worker.celery_app worker
      --loglevel=INFO
      --queues=interactive,sync
      --concurrency=${CELERY_CONCURRENCY:-2}
      --prefetch-multiplier=${CELERY_WORKER_PREFETCH_MULTIPLIER:-1}
      --max-tasks-per-child=${CELERY_WORKER_MAX_TASKS_PER_CHILD:-25}
      --max-memory-per-child=${CELERY_WORKER_MAX_MEMORY_PER_CHILD_KB:-600000}
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - runtime_data:/app/.runtime
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$(hostname) --timeout=5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - ai_internal
      - openedx_shared
    extra_hosts:
      - "cms-test.poly.edu.vn:host-gateway"
      - "scms-test.poly.edu.vn:host-gateway"
      - "app.cms-test.poly.edu.vn:host-gateway"
      - "ai.cms-test.poly.edu.vn:host-gateway"
      - "api-ai.cms-test.poly.edu.vn:host-gateway"
      - "meilisearch.cms-test.poly.edu.vn:host-gateway"
      - "api_v2.poly.edu.vn:10.2.1.35"
      - "apitest.poly.edu.vn:10.2.5.8"

  worker-heavy:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    container_name: ai-worker-heavy
    env_file: .env.production
    environment:
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/app/.runtime}
    restart: unless-stopped
    command: >
      celery -A app.worker.celery_app worker
      --loglevel=INFO
      --queues=generation,exports
      --concurrency=${CELERY_HEAVY_CONCURRENCY:-1}
      --prefetch-multiplier=${CELERY_WORKER_PREFETCH_MULTIPLIER:-1}
      --max-tasks-per-child=${CELERY_WORKER_MAX_TASKS_PER_CHILD:-25}
      --max-memory-per-child=${CELERY_WORKER_MAX_MEMORY_PER_CHILD_KB:-600000}
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - runtime_data:/app/.runtime
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$(hostname) --timeout=5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - ai_internal
      - openedx_shared
    extra_hosts:
      - "cms-test.poly.edu.vn:host-gateway"
      - "scms-test.poly.edu.vn:host-gateway"
      - "app.cms-test.poly.edu.vn:host-gateway"
      - "ai.cms-test.poly.edu.vn:host-gateway"
      - "api-ai.cms-test.poly.edu.vn:host-gateway"
      - "meilisearch.cms-test.poly.edu.vn:host-gateway"
      - "api_v2.poly.edu.vn:10.2.1.35"
      - "apitest.poly.edu.vn:10.2.5.8"

  worker-analytics:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    container_name: ai-worker-analytics
    env_file: .env.production
    environment:
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/app/.runtime}
    restart: unless-stopped
    command: >
      celery -A app.worker.celery_app worker
      --loglevel=INFO
      --queues=analytics
      --concurrency=${CELERY_ANALYTICS_CONCURRENCY:-1}
      --prefetch-multiplier=${CELERY_WORKER_PREFETCH_MULTIPLIER:-1}
      --max-tasks-per-child=${CELERY_WORKER_MAX_TASKS_PER_CHILD:-25}
      --max-memory-per-child=${CELERY_WORKER_MAX_MEMORY_PER_CHILD_KB:-600000}
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - runtime_data:/app/.runtime
      - ${OPENEDX_TRACKING_LOG_HOST_DIR:-/home/thaitx3/.local/share/tutor/data/lms/logs}:/openedx-data/lms/logs:ro
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$(hostname) --timeout=5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - ai_internal
      - openedx_shared

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    container_name: ai-beat
    env_file: .env.production
    environment:
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/app/.runtime}
    restart: unless-stopped
    command: celery -A app.worker.celery_app beat --loglevel=INFO --pidfile=/tmp/celerybeat.pid --schedule=/app/.runtime/celerybeat-schedule
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - runtime_data:/app/.runtime
      - ${OPENEDX_TRACKING_LOG_HOST_DIR:-/home/thaitx3/.local/share/tutor/data/lms/logs}:/openedx-data/lms/logs:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat.pid && kill -0 $$(cat /tmp/celerybeat.pid) && test -w /app/.runtime"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - ai_internal
      - openedx_shared
    extra_hosts:
      - "cms-test.poly.edu.vn:host-gateway"
      - "scms-test.poly.edu.vn:host-gateway"
      - "app.cms-test.poly.edu.vn:host-gateway"
      - "ai.cms-test.poly.edu.vn:host-gateway"
      - "api-ai.cms-test.poly.edu.vn:host-gateway"
      - "meilisearch.cms-test.poly.edu.vn:host-gateway"
      - "api_v2.poly.edu.vn:10.2.1.35"
      - "apitest.poly.edu.vn:10.2.5.8"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api-ai.cms-test.poly.edu.vn}
        NEXT_PUBLIC_OPENEDX_CMS_BASE_URL: ${NEXT_PUBLIC_OPENEDX_CMS_BASE_URL:-https://scms-test.poly.edu.vn}
        NEXT_PUBLIC_AUTO_CMS_SESSION_LOGIN: ${NEXT_PUBLIC_AUTO_CMS_SESSION_LOGIN:-true}
        NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-production}
        NEXT_PUBLIC_ENABLE_DIAGNOSTICS_UI: ${NEXT_PUBLIC_ENABLE_DIAGNOSTICS_UI:-false}
        NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-25.9.16.7.2.64.16.5.6}
        NEXT_PUBLIC_API_GET_TIMEOUT_MS: ${NEXT_PUBLIC_API_GET_TIMEOUT_MS:-45000}
        NEXT_PUBLIC_API_WRITE_TIMEOUT_MS: ${NEXT_PUBLIC_API_WRITE_TIMEOUT_MS:-120000}
    container_name: ai-frontend
    env_file: .env.production
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      openedx_shared:
        aliases:
          - ai-frontend
    extra_hosts:
      - "cms-test.poly.edu.vn:host-gateway"
      - "scms-test.poly.edu.vn:host-gateway"
      - "app.cms-test.poly.edu.vn:host-gateway"
      - "ai.cms-test.poly.edu.vn:host-gateway"
      - "api-ai.cms-test.poly.edu.vn:host-gateway"

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: ai-prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    expose:
      - "9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ai_internal
      - openedx_shared

  grafana:
    image: grafana/grafana:11.4.0
    container_name: ai-grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - openedx_shared

volumes:
  postgres_data:
  redis_data:
  runtime_data:
  grafana_data:

networks:
  ai_internal:
    internal: true
  openedx_shared:
    external: true
    name: ${OPENEDX_SHARED_NETWORK:-tutor_local_default}
