services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_openedx}
      POSTGRES_USER: ${POSTGRES_USER:-ai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in 
        .env.production}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
    - ai_internal
  redis:
    image: redis:7-alpine
    container_name: ai-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}
    command:
    - redis-server
    - --appendonly
    - 'yes'
    - --requirepass
    - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
    - ai_internal
    extra_hosts:
    - cms-test.poly.edu.vn:host-gateway
    - scms-test.poly.edu.vn:host-gateway
    - app.cms-test.poly.edu.vn:host-gateway
    - ai.cms-test.poly.edu.vn:host-gateway
    - api-ai.cms-test.poly.edu.vn:host-gateway
    - meilisearch.cms-test.poly.edu.vn:host-gateway
    - api_v2.poly.edu.vn:10.2.1.35
  runtime-init:
    env_file: .env.production
    user: 0:0
    restart: 'no'
    command:
    - sh
    - -c
    - mkdir -p /app/.runtime && chown -R 10001:10001 /app/.runtime && chmod 0770
      /app/.runtime
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 64
    volumes:
    - runtime_data:/app/.runtime
    networks:
    - ai_internal
    cap_add:
    - CHOWN
    - FOWNER
    - DAC_OVERRIDE
    image: 
      ${BACKEND_IMAGE:-ai-server-backend:${APP_VERSION:-25.9.16.7.2.64.16.5.7.2.18}}
  migrate:
    env_file: .env.production
    user: 10001:10001
    restart: 'no'
    command:
    - alembic
    - -c
    - alembic.ini
    - upgrade
    - head
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=128m
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 128
    depends_on:
      postgres:
        condition: service_healthy
    networks:
    - ai_internal
    image: 
      ${BACKEND_IMAGE:-ai-server-backend:${APP_VERSION:-25.9.16.7.2.64.16.5.7.2.18}}
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    container_name: ai-backend
    env_file: .env.production
    environment:
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/app/.runtime}
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    restart: unless-stopped
    command:
    - gunicorn
    - app.main:app
    - -k
    - uvicorn.workers.UvicornWorker
    - -w
    - ${WEB_CONCURRENCY:-2}
    - -b
    - 0.0.0.0:8000
    - --forwarded-allow-ips=*
    - --timeout
    - ${WEB_TIMEOUT_SECONDS:-120}
    - --graceful-timeout
    - '30'
    - --worker-tmp-dir
    - /tmp
    - --access-logfile
    - '-'
    - --error-logfile
    - '-'
    - --capture-output
    expose:
    - '8000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      runtime-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    volumes:
    - runtime_data:/app/.runtime
    - ${OPENEDX_TRACKING_LOG_HOST_DIR:-/home/thaitx3/.local/share/tutor/data/lms/logs}:/openedx-data/lms/logs:ro
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - "import http.client; c=http.client.HTTPConnection('127.0.0.1', 8000, timeout=5);
        c.request('GET', '/api/health'); r=c.getresponse(); raise SystemExit(0 if
        r.status == 200 else 1)"
      interval: 10s
      timeout: 8s
      retries: 18
      start_period: 90s
    networks:
      ai_internal:
      openedx_shared:
        aliases:
        - ai-backend
    extra_hosts:
    - cms-test.poly.edu.vn:host-gateway
    - scms-test.poly.edu.vn:host-gateway
    - app.cms-test.poly.edu.vn:host-gateway
    - ai.cms-test.poly.edu.vn:host-gateway
    - api-ai.cms-test.poly.edu.vn:host-gateway
    - meilisearch.cms-test.poly.edu.vn:host-gateway
    - api_v2.poly.edu.vn:10.2.1.35
    user: 10001:10001
    read_only: true
    init: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 256
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=256m
    mem_limit: 2g
    cpus: '2.0'
    stop_grace_period: 45s
    image: 
      ${BACKEND_IMAGE:-ai-server-backend:${APP_VERSION:-25.9.16.7.2.64.16.5.7.2.18}}
  worker:
    container_name: ai-worker
    env_file: .env.production
    environment:
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/app/.runtime}
      HOME: /tmp
    restart: unless-stopped
    command: 'celery -A app.worker.celery_app worker --loglevel=INFO --queues=interactive,sync
      --concurrency=${CELERY_CONCURRENCY:-2} --prefetch-multiplier=${CELERY_WORKER_PREFETCH_MULTIPLIER:-1}
      --max-tasks-per-child=${CELERY_WORKER_MAX_TASKS_PER_CHILD:-25} --max-memory-per-child=${CELERY_WORKER_MAX_MEMORY_PER_CHILD_KB:-600000}
      --hostname=worker@%h

      '
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      runtime-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    volumes:
    - runtime_data:/app/.runtime
    healthcheck:
      test:
      - CMD-SHELL
      - celery -A app.worker.celery_app inspect ping -d worker@$$(hostname) 
        --timeout=8 | grep -q pong
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
    - ai_internal
    - openedx_shared
    extra_hosts:
    - cms-test.poly.edu.vn:host-gateway
    - scms-test.poly.edu.vn:host-gateway
    - app.cms-test.poly.edu.vn:host-gateway
    - ai.cms-test.poly.edu.vn:host-gateway
    - api-ai.cms-test.poly.edu.vn:host-gateway
    - meilisearch.cms-test.poly.edu.vn:host-gateway
    - api_v2.poly.edu.vn:10.2.1.35
    user: 10001:10001
    read_only: true
    init: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 256
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=512m
    mem_limit: 2g
    cpus: '2.0'
    stop_grace_period: 45s
    image: 
      ${BACKEND_IMAGE:-ai-server-backend:${APP_VERSION:-25.9.16.7.2.64.16.5.7.2.18}}
  worker-heavy:
    container_name: ai-worker-heavy
    env_file: .env.production
    environment:
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/app/.runtime}
      HOME: /tmp
    restart: unless-stopped
    command: 'celery -A app.worker.celery_app worker --loglevel=INFO --queues=generation,exports
      --concurrency=${CELERY_HEAVY_CONCURRENCY:-1} --prefetch-multiplier=${CELERY_WORKER_PREFETCH_MULTIPLIER:-1}
      --max-tasks-per-child=${CELERY_WORKER_MAX_TASKS_PER_CHILD:-25} --max-memory-per-child=${CELERY_WORKER_MAX_MEMORY_PER_CHILD_KB:-600000}
      --hostname=worker-heavy@%h

      '
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      runtime-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    volumes:
    - runtime_data:/app/.runtime
    healthcheck:
      test:
      - CMD-SHELL
      - celery -A app.worker.celery_app inspect ping -d 
        worker-heavy@$$(hostname) --timeout=8 | grep -q pong
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
    - ai_internal
    - openedx_shared
    extra_hosts:
    - cms-test.poly.edu.vn:host-gateway
    - scms-test.poly.edu.vn:host-gateway
    - app.cms-test.poly.edu.vn:host-gateway
    - ai.cms-test.poly.edu.vn:host-gateway
    - api-ai.cms-test.poly.edu.vn:host-gateway
    - meilisearch.cms-test.poly.edu.vn:host-gateway
    - api_v2.poly.edu.vn:10.2.1.35
    user: 10001:10001
    read_only: true
    init: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 256
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=1g
    mem_limit: 4g
    cpus: '2.0'
    stop_grace_period: 45s
    image: 
      ${BACKEND_IMAGE:-ai-server-backend:${APP_VERSION:-25.9.16.7.2.64.16.5.7.2.18}}
  worker-analytics:
    container_name: ai-worker-analytics
    env_file: .env.production
    environment:
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/app/.runtime}
      HOME: /tmp
    restart: unless-stopped
    command: 'celery -A app.worker.celery_app worker --loglevel=INFO --queues=analytics
      --concurrency=${CELERY_ANALYTICS_CONCURRENCY:-1} --prefetch-multiplier=${CELERY_WORKER_PREFETCH_MULTIPLIER:-1}
      --max-tasks-per-child=${CELERY_WORKER_MAX_TASKS_PER_CHILD:-25} --max-memory-per-child=${CELERY_WORKER_MAX_MEMORY_PER_CHILD_KB:-600000}
      --hostname=worker-analytics@%h

      '
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      runtime-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    volumes:
    - runtime_data:/app/.runtime
    - ${OPENEDX_TRACKING_LOG_HOST_DIR:-/home/thaitx3/.local/share/tutor/data/lms/logs}:/openedx-data/lms/logs:ro
    healthcheck:
      test:
      - CMD-SHELL
      - celery -A app.worker.celery_app inspect ping -d 
        worker-analytics@$$(hostname) --timeout=8 | grep -q pong
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
    - ai_internal
    - openedx_shared
    user: 10001:10001
    read_only: true
    init: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 256
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=512m
    mem_limit: 3g
    cpus: '2.0'
    stop_grace_period: 45s
    image: 
      ${BACKEND_IMAGE:-ai-server-backend:${APP_VERSION:-25.9.16.7.2.64.16.5.7.2.18}}
  beat:
    container_name: ai-beat
    env_file: .env.production
    environment:
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/app/.runtime}
      HOME: /tmp
    restart: unless-stopped
    command: celery -A app.worker.celery_app beat --loglevel=INFO 
      --pidfile=/tmp/celerybeat.pid --schedule=/app/.runtime/celerybeat-schedule
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      runtime-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    volumes:
    - runtime_data:/app/.runtime
    - ${OPENEDX_TRACKING_LOG_HOST_DIR:-/home/thaitx3/.local/share/tutor/data/lms/logs}:/openedx-data/lms/logs:ro
    healthcheck:
      test:
      - CMD-SHELL
      - test -f /tmp/celerybeat.pid && kill -0 $$(cat /tmp/celerybeat.pid) && 
        test -w /app/.runtime
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
    - ai_internal
    - openedx_shared
    extra_hosts:
    - cms-test.poly.edu.vn:host-gateway
    - scms-test.poly.edu.vn:host-gateway
    - app.cms-test.poly.edu.vn:host-gateway
    - ai.cms-test.poly.edu.vn:host-gateway
    - api-ai.cms-test.poly.edu.vn:host-gateway
    - meilisearch.cms-test.poly.edu.vn:host-gateway
    - api_v2.poly.edu.vn:10.2.1.35
    user: 10001:10001
    read_only: true
    init: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 128
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=256m
    mem_limit: 1g
    cpus: '1.0'
    stop_grace_period: 45s
    image: 
      ${BACKEND_IMAGE:-ai-server-backend:${APP_VERSION:-25.9.16.7.2.64.16.5.7.2.18}}
  frontend:
    build:
      context: ./frontend
      args:
        NPM_VERSION: ${FRONTEND_NPM_VERSION:-10.9.2}
        FRONTEND_VALIDATE_IN_IMAGE: ${FRONTEND_VALIDATE_IN_IMAGE:-false}
        NEXT_PUBLIC_API_BASE_URL: 
          ${NEXT_PUBLIC_API_BASE_URL:-https://api-ai.cms-test.poly.edu.vn}
        NEXT_PUBLIC_OPENEDX_CMS_BASE_URL: 
          ${NEXT_PUBLIC_OPENEDX_CMS_BASE_URL:-https://scms-test.poly.edu.vn}
        NEXT_PUBLIC_AUTO_CMS_SESSION_LOGIN: 
          ${NEXT_PUBLIC_AUTO_CMS_SESSION_LOGIN:-true}
        NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-production}
        NEXT_PUBLIC_ENABLE_DIAGNOSTICS_UI: 
          ${NEXT_PUBLIC_ENABLE_DIAGNOSTICS_UI:-false}
        NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-25.9.16.7.2.64.16.5.7.2.18}
        NEXT_PUBLIC_API_GET_TIMEOUT_MS: ${NEXT_PUBLIC_API_GET_TIMEOUT_MS:-45000}
        NEXT_PUBLIC_API_WRITE_TIMEOUT_MS: 
          ${NEXT_PUBLIC_API_WRITE_TIMEOUT_MS:-120000}
    container_name: ai-frontend
    env_file: .env.production
    restart: unless-stopped
    expose:
    - '3000'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      openedx_shared:
        aliases:
        - ai-frontend
    extra_hosts:
    - cms-test.poly.edu.vn:host-gateway
    - scms-test.poly.edu.vn:host-gateway
    - app.cms-test.poly.edu.vn:host-gateway
    - ai.cms-test.poly.edu.vn:host-gateway
    - api-ai.cms-test.poly.edu.vn:host-gateway
    user: 10001:10001
    read_only: true
    init: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 128
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=128m
    - /app/.next/cache:rw,noexec,nosuid,nodev,size=256m,mode=1777
    mem_limit: 1g
    cpus: '1.0'
    stop_grace_period: 45s
    environment:
      HOME: /tmp
    healthcheck:
      test:
      - CMD-SHELL
      - node -e 
        "fetch('http://127.0.0.1:3000/auth/logged-out').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 20s
      timeout: 8s
      retries: 10
      start_period: 20s
    image: 
      ${FRONTEND_IMAGE:-ai-server-frontend:${APP_VERSION:-25.9.16.7.2.64.16.5.7.2.18}}
  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: ai-prometheus
    profiles:
    - monitoring
    restart: unless-stopped
    expose:
    - '9090'
    volumes:
    - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
    - ai_internal
    - openedx_shared
  grafana:
    image: grafana/grafana:11.4.0
    container_name: ai-grafana
    profiles:
    - monitoring
    restart: unless-stopped
    expose:
    - '3000'
    volumes:
    - grafana_data:/var/lib/grafana
    - ./infra/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
    - openedx_shared
volumes:
  postgres_data:
  redis_data:
  runtime_data:
  grafana_data:
networks:
  ai_internal:
    internal: true
  openedx_shared:
    external: true
    name: ${OPENEDX_SHARED_NETWORK:-tutor_local_default}
